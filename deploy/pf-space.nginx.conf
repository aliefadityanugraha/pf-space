# Nginx Configuration for PF Space
# =============================================================================
# File ini disesuaikan untuk pola konfigurasi aapanel / reverse proxy.
#
# Cara pakai:
#   1. Salin ke file site config Nginx Anda.
#   2. Jalankan nginx -t.
#   3. Reload nginx setelah memastikan tidak ada error.
# =============================================================================

server {
    listen 80;
    server_name 192.168.3.229 localhost pfspace.my.id www.pfspace.my.id;
    index index.html index.htm;

    #ERROR-PAGE-START
    error_page 404 /404.html;
    error_page 502 /502.html;
    #ERROR-PAGE-END

    # Header keamanan dasar
    add_header X-Frame-Options "SAMEORIGIN";
    add_header X-Content-Type-Options "nosniff";
    add_header X-XSS-Protection "1; mode=block";
    add_header Referrer-Policy "strict-origin-when-cross-origin";

    # Header penting untuk Better Auth + Tus
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Forwarded-Host $host;
    proxy_set_header X-Forwarded-Port $server_port;

    client_max_body_size 0;
    proxy_request_buffering off;
    proxy_http_version 1.1;

    # 1. Proxy ke backend API dan Tus upload
    location /api/ {
        proxy_pass http://127.0.0.1:3001;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Forwarded-Port $server_port;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";

        proxy_connect_timeout 60s;
        proxy_send_timeout 3600s;
        proxy_read_timeout 3600s;
    }

    # 2. Proxy ke frontend Vite dev server / built dist
    location / {
        proxy_pass http://127.0.0.1:5173;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
    }

    # Blokir file sensitif
    location ~ ^/(\.user\.ini|\.htaccess|\.git|\.env|\.svn|\.project|LICENSE|README\.md) {
        return 404;
    }

    # SSL certificate verification directory
    location ~ \.well-known {
        allow all;
    }

    access_log /www/wwwlogs/192.168.3.229.log;
    error_log /www/wwwlogs/192.168.3.229.error.log;
}
